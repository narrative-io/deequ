name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: [self-hosted]

    strategy:
      fail-fast: false
      matrix:
        scala: [ "2.12", "2.13" ]

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'corretto'
        cache: maven
    - name: Install Maven
      run: |
        MAVEN_VERSION=3.9.9
        curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" -o /tmp/maven.tar.gz
        mkdir -p "$HOME/maven"
        tar -xzf /tmp/maven.tar.gz -C "$HOME/maven" --strip-components=1
        echo "$HOME/maven/bin" >> "$GITHUB_PATH"
    - name: Verify Maven
      run: mvn -v
    - name: Build with Maven (Scala ${{ matrix.scala }})
      run: mvn clean verify -Pscala-${{ matrix.scala }}

